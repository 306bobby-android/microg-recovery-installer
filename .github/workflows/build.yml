name: Build

# Verification only. Releases come from the Release workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: apks
        uses: ./.github/actions/fetch-apks

      - name: Work out the version
        id: meta
        run: echo "version=${{ steps.apks.outputs.gms }}+${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        run: scripts/build_zip.sh "${{ steps.meta.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: microg-recovery-installer-${{ steps.meta.outputs.version }}
          path: |
            dist/*.zip
            dist/*.sha256
